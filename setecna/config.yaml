# https://developers.home-assistant.io/docs/add-ons/configuration#add-on-config
name: Setecna REG system
version: "1.0.1"
slug: setecna
description: Setecna REG system web integration
url: "https://github.com/Ingordigia/homeassistant-addon-setecna"
arch:
  - armhf
  - armv7
  - aarch64
  - amd64
  - i386
init: false
map:
  - share:rw
options:
  systemID: null
  username: null
  password: null
  readonly: false
  adv_int: false
  mqtt_host: null
  mqtt_port: 1883
  mqtt_user: null
  mqtt_password: null
schema:
  systemID: "str"
  username: "str"
  password: "password"
  readonly: bool
  adv_int: bool
  mqtt_host: "str?"
  mqtt_port: "port?"
  mqtt_user: "str?"
  mqtt_password: "password?"
services:
  - mqtt:want
