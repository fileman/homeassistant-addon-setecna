# https://developers.home-assistant.io/docs/add-ons/configuration#add-on-config
name: Setecna REG system
version: "1.2.1"
slug: setecna
description: Setecna REG system web integration
url: "https://github.com/Ingordigia/homeassistant-addon-setecna"
arch:
  - armhf
  - aarch64
  - amd64
  - i386
init: false
map:
  - share:rw
options:
  systemID: null
  username: null
  password: null
  readonly: false
  adv_int: false
  debug_dump: false
schema:
  systemID: "str"
  username: "str"
  password: "password"
  readonly: bool
  adv_int: bool
  mqtt_host: "str?"
  mqtt_port: "port?"
  mqtt_user: "str?"
  mqtt_password: "password?"
  debug_dump: bool
services:
  - mqtt:want
